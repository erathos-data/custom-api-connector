# REST endpoint, offset-number pagination.
request:
  method: GET # required
  endpoint: "/orders" # required
  params:
    page: "<page>"

response:
  path: [data]  # list index 0, then the "results" key - path supports both

  # total_count tells the caller when to stop requesting the next page.
  pagination:
    type: token # required
    path: [metadata, next] # required for token type

fields: # required
  - name: id # required
    type: string # required
  - name: product_name
    type: string
  - name: buyer.name
    type: string
